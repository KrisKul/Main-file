name: Imperium Rogue Build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/imperium-rogue.yml"
      - "imperium-rogue/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    env:
      TARGET_COMMIT: f8c9fbb73cc4f3853b056aebfc427d6e4822ea9b
      PATCH_SHA256: c2bdb91f1871f46d1a54e58706366bded3fadbe1ef55fb9e358cc3b10e0a791a
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          apt-get update
          apt-get install -y git unzip python3 build-essential libpng-dev libelf-dev golang-go gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Decode and verify Rogue patch
        run: |
          base64 -d imperium-rogue/rogue_patch.b64 > /tmp/imperium-rogue-v0.1.2-source.zip
          echo "$PATCH_SHA256  /tmp/imperium-rogue-v0.1.2-source.zip" | sha256sum -c -
          unzip -tq /tmp/imperium-rogue-v0.1.2-source.zip
          unzip -q /tmp/imperium-rogue-v0.1.2-source.zip -d /tmp/rogue
          cd /tmp/rogue/imperium-rogue-v0.1.2
          echo "fa98466d2258a26c1a7ffb0a82df20052070913cd5f6812afd4c8fd06c77c980  files/src/rogue_mode.c" | sha256sum -c -
          echo "731a5b4923b28b5968a3b1aac25a114f3c99de6b9990b0a53fcb0229ede27bc4  files/include/rogue_mode.h" | sha256sum -c -
          echo "195b6fa1378c24a1d44b198e35e5f4dc4c2034e27624e2e9551a9cf73b632caf  apply_rogue_patch.py" | sha256sum -c -
          echo "435924f3eebb37228ca7fa8a651fbbe3f85cdbedc39bddcc6366192d236db6e4  tests/test_package.py" | sha256sum -c -
          python3 tests/test_package.py

      - name: Fetch exact Imperium v1.2 source
        run: |
          git clone https://github.com/iriv24/pokeemerald-expansion.git /tmp/imperium
          git -C /tmp/imperium checkout "$TARGET_COMMIT"
          test "$(git -C /tmp/imperium rev-parse HEAD)" = "$TARGET_COMMIT"

      - name: Install pinned poryscript
        run: |
          rm -rf /tmp/imperium/tools/poryscript
          git clone https://github.com/huderlem/poryscript.git /tmp/imperium/tools/poryscript
          git -C /tmp/imperium/tools/poryscript checkout 67cdd2342fa9d22f0cd80effca4d3943b7bf8d2c
          make -C /tmp/imperium/tools/poryscript
          test -x /tmp/imperium/tools/poryscript/poryscript

      - name: Apply Rogue Mode
        run: |
          python3 /tmp/rogue/imperium-rogue-v0.1.2/apply_rogue_patch.py /tmp/imperium
          git -C /tmp/imperium diff --check
          git -C /tmp/imperium status --short

      - name: Build ROM
        run: |
          arm-none-eabi-gcc --version
          make -C /tmp/imperium -j"$(nproc)" -O all COMPARE=0 UNUSED_ERROR=0 TOOLCHAIN=
          test -f /tmp/imperium/pokeemerald.gba
          sha256sum /tmp/imperium/pokeemerald.gba

      - name: Test
        run: |
          make -C /tmp/imperium -j"$(nproc)" check COMPARE=0 UNUSED_ERROR=0 TOOLCHAIN=

      - name: Upload ROM and symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: imperium-rogue-v0.1.2
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/imperium/pokeemerald.gba
            /tmp/imperium/pokeemerald.map
            /tmp/imperium/pokeemerald.sym
