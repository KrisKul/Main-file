name: Imperium Rogue Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    env:
      TARGET_COMMIT: f8c9fbb73cc4f3853b056aebfc427d6e4822ea9b
      PATCH_SHA256: ff87054d4a512d6b3648cc5a1d7c138b9b5d38761260213ca681411114f66e20
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          apt-get update
          apt-get install -y git unzip python3 build-essential libpng-dev libelf-dev

      - name: Decode and verify Rogue patch
        run: |
          base64 -d imperium-rogue/rogue_patch.b64 > /tmp/imperium-rogue-v0.1.1-source.zip
          echo "$PATCH_SHA256  /tmp/imperium-rogue-v0.1.1-source.zip" | sha256sum -c -
          unzip -q /tmp/imperium-rogue-v0.1.1-source.zip -d /tmp/rogue
          python3 /tmp/rogue/imperium-rogue-v0.1.1/tests/test_package.py

      - name: Fetch exact Imperium v1.2 source
        run: |
          git clone https://github.com/iriv24/pokeemerald-expansion.git /tmp/imperium
          git -C /tmp/imperium checkout "$TARGET_COMMIT"
          test "$(git -C /tmp/imperium rev-parse HEAD)" = "$TARGET_COMMIT"

      - name: Apply Rogue Mode
        run: |
          python3 /tmp/rogue/imperium-rogue-v0.1.1/apply_rogue_patch.py /tmp/imperium
          git -C /tmp/imperium diff --check
          git -C /tmp/imperium status --short

      - name: Build ROM
        run: |
          make -C /tmp/imperium -j"$(nproc)" -O all COMPARE=0 UNUSED_ERROR=0
          test -f /tmp/imperium/pokeemerald.gba
          sha256sum /tmp/imperium/pokeemerald.gba

      - name: Upload ROM and symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: imperium-rogue-v0.1.1
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/imperium/pokeemerald.gba
            /tmp/imperium/pokeemerald.map
            /tmp/imperium/pokeemerald.sym
