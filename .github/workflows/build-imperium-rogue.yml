name: Build Imperium Rogue

on:
  push:
    branches:
      - imperium-rogue-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    env:
      IMPERIUM_COMMIT: f8c9fbb73cc4f3853b056aebfc427d6e4822ea9b
      PATCH_SHA256: ff87054d4a512d6b3648cc5a1d7c138b9b5d38761260213ca681411114f66e20
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4
        with:
          ref: imperium-rogue-build

      - name: Install host dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev libelf-dev git unzip python3 golang-go

      - name: Reassemble and verify Rogue patch
        shell: bash
        run: |
          cat rogue_patch/part1.b64 rogue_patch/part2.b64 rogue_patch/part3.b64 rogue_patch/part4.b64 rogue_patch/part5.b64 | tr -d '\n\r ' | base64 -d > /tmp/imperium-rogue-v0.1.1-source.zip
          echo "$PATCH_SHA256  /tmp/imperium-rogue-v0.1.1-source.zip" | sha256sum -c -
          mkdir -p /tmp/rogue_patch
          unzip -q /tmp/imperium-rogue-v0.1.1-source.zip -d /tmp/rogue_patch
          python3 /tmp/rogue_patch/imperium-rogue-v0.1.1/tests/test_package.py

      - name: Fetch exact Imperium v1.2 source
        shell: bash
        run: |
          git clone https://github.com/iriv24/pokeemerald-expansion.git imperium
          git -C imperium checkout "$IMPERIUM_COMMIT"
          test "$(git -C imperium rev-parse HEAD)" = "$IMPERIUM_COMMIT"

      - name: Install pinned poryscript
        shell: bash
        run: |
          rm -rf imperium/tools/poryscript
          git clone https://github.com/huderlem/poryscript.git imperium/tools/poryscript
          git -C imperium/tools/poryscript checkout 67cdd2342fa9d22f0cd80effca4d3943b7bf8d2c
          make -C imperium/tools/poryscript
          test -x imperium/tools/poryscript/poryscript

      - name: Apply Rogue patch
        shell: bash
        run: |
          python3 /tmp/rogue_patch/imperium-rogue-v0.1.1/apply_rogue_patch.py "$GITHUB_WORKSPACE/imperium"
          git -C imperium diff --check

      - name: Build ROM
        shell: bash
        run: |
          make -C imperium -j"$(nproc)" COMPARE=0 UNUSED_ERROR=0
          test -s imperium/pokeemerald.gba
          sha256sum imperium/pokeemerald.gba | tee imperium/imperium-rogue-v0.1.1.sha256
          cp imperium/pokeemerald.gba imperium/Imperium-Rogue-v0.1.1.gba

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Imperium-Rogue-v0.1.1
          path: |
            imperium/Imperium-Rogue-v0.1.1.gba
            imperium/imperium-rogue-v0.1.1.sha256
          if-no-files-found: error
